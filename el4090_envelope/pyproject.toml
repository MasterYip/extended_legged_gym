[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "el4090-envelope"
version = "0.1.0"
description = "Batched kinematics and occupied-body support envelopes for EL4090"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "EL4090 project contributors"}]
dependencies = ["numpy>=1.20", "torch>=1.10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
